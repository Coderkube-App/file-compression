<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <!-- Dark Mode Theme Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- File Icon Gradients -->
    <linearGradient id="fileRawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="fileOptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Engine Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 5px #818cf8); }
      50% { opacity: 1; filter: drop-shadow(0 0 20px #c084fc); }
    }

    @keyframes particleMove {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes shrink {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.96); }
    }

    /* Styles */
    .bg { fill: url(#bgGrad); }
    .text-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 32px; fill: #ffffff; }
    .text-subtitle { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; font-size: 12px; fill: #4b5563; letter-spacing: 4px; }
    .github-url { font-family: monospace; font-size: 12px; fill: #818cf8; font-weight: 600; opacity: 0.85; }

    .engine-core {
      fill: #1e1b4b;
      stroke: url(#laserGrad);
      stroke-width: 3;
      animation: pulseGlow 4s infinite ease-in-out, shrink 3s infinite ease-in-out;
      transform-origin: 400px 205px;
    }

    .pipeline-laser {
      stroke: url(#laserGrad);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 10 15;
      animation: particleMove 2.5s infinite linear;
    }

    .icon-float-raw {
      animation: float 4s infinite ease-in-out;
    }

    .icon-float-opt {
      animation: float 4s infinite ease-in-out;
      animation-delay: 2s;
    }
  </style>

  <!-- Background Canvas -->
  <rect class="bg" width="100%" height="100%" rx="16" />

  <!-- Clean Grid overlay -->
  <g stroke="#1e293b" stroke-width="0.75" opacity="0.3">
    <line x1="0" y1="70" x2="800" y2="70" />
    <line x1="0" y1="140" x2="800" y2="140" />
    <line x1="0" y1="210" x2="800" y2="210" />
    <line x1="0" y1="280" x2="800" y2="280" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="640" y1="0" x2="640" y2="360" />
  </g>

  <!-- Branding Group -->
  <g transform="translate(60, 60)">
    <text x="0" y="0" class="text-title">Express File Compressor</text>
    <text x="0" y="22" class="text-subtitle">AUTOMATED MULTI-FORMAT MEDIA PROCESSING &amp; OPTIMIZATION</text>
    <g transform="translate(0, 42)">
      <path d="M0,-5 L12,-5" stroke="#818cf8" stroke-width="2" />
      <text x="22" y="0" class="github-url">github.com/Coderkube-App/file-compression</text>
    </g>
  </g>

  <!-- PIPELINE FLOW SYSTEM (Middle section: y=160 to y=250) -->
  <g>
    <!-- Left Connection Line (Laser Conduit) -->
    <path d="M 230,205 L 340,205" class="pipeline-laser" />
    <!-- Right Connection Line (Laser Conduit) -->
    <path d="M 460,205 L 570,205" class="pipeline-laser" />

    <!-- 1. LEFT ZONE: RAW LARGE UPLOADS (Uncompressed Input) -->
    <g transform="translate(110, 140)">
      <g class="icon-float-raw">
        <!-- File Outline shadow -->
        <rect x="-10" y="0" width="80" height="95" rx="8" fill="#111827" stroke="#374151" stroke-width="1.5" />
        <!-- Giant File Icon (Red Gradient) -->
        <path d="M0,0 L50,0 L65,15 L65,85 L0,85 Z" fill="url(#fileRawGrad)" transform="translate(0, 5)"/>
        <path d="M50,5 L50,20 L65,20 Z" fill="#fca5a5" />
        <!-- Text label inside icon -->
        <text x="32" y="45" font-family="sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">15.0 MB</text>
        <text x="32" y="60" font-family="sans-serif" font-weight="bold" font-size="9" fill="#fee2e2" text-anchor="middle">PNG / MOV / PDF</text>
        <!-- Zone Description -->
        <rect x="-20" y="105" width="105" height="18" rx="4" fill="#311" stroke="#ef4444" stroke-width="0.5" />
        <text x="32.5" y="118" font-family="sans-serif" font-weight="bold" font-size="9.5" fill="#ef4444" text-anchor="middle">RAW UPLOAD</text>
      </g>
    </g>

    <!-- 2. CENTER ZONE: COMPRESSION SYSTEM (The Engine) -->
    <g>
      <!-- Processor Shell Ring -->
      <circle cx="400" cy="205" r="54" fill="none" stroke="#312e81" stroke-width="2" stroke-dasharray="6 6" />
      <!-- Glowing Engine Box -->
      <rect x="340" y="170" width="120" height="70" rx="14" class="engine-core" />
      <!-- Cog / Process Icon inside Engine -->
      <text x="400" y="202" font-family="sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="2">COMPRESS</text>
      <text x="400" y="220" font-family="sans-serif" font-weight="bold" font-size="9" fill="#38bdf8" text-anchor="middle" letter-spacing="1">ENGINE</text>
    </g>

    <!-- 3. RIGHT ZONE: OPTIMIZED OUTPUT (Squeezed result) -->
    <g transform="translate(615, 155)">
      <g class="icon-float-opt">
        <!-- File Outline shadow -->
        <rect x="-10" y="0" width="65" height="78" rx="6" fill="#111827" stroke="#374151" stroke-width="1.5" />
        <!-- Smaller File Icon (Green Gradient) -->
        <path d="M0,0 L40,0 L50,10 L50,68 L0,68 Z" fill="url(#fileOptGrad)" transform="translate(-2, 5)"/>
        <path d="M38,5 L38,15 L48,15 Z" fill="#a7f3d0" />
        <!-- Text label inside icon -->
        <text x="24" y="38" font-family="sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">1.2 MB</text>
        <text x="24" y="50" font-family="sans-serif" font-weight="bold" font-size="8.5" fill="#d1fae5" text-anchor="middle">SAVED</text>
        <!-- Zone Description -->
        <rect x="-15" y="90" width="75" height="18" rx="4" fill="#131" stroke="#10b981" stroke-width="0.5" />
        <text x="22.5" y="102" font-family="sans-serif" font-weight="bold" font-size="9.5" fill="#10b981" text-anchor="middle">OPTIMIZED</text>
      </g>
    </g>
  </g>
</svg>
